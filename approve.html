<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約承認 — グリーンレンタカー北海道店</title>
<style>
  body { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
         background: #f5f5f5; margin: 0; padding: 20px; }
  .card { background: #fff; max-width: 500px; margin: 40px auto;
          border-radius: 12px; padding: 40px 32px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  h1 { font-size: 1.2rem; color: #1a5276; border-bottom: 2px solid #1a5276;
       padding-bottom: 10px; margin-top: 0; }
  .btn-wrap { display: flex; gap: 16px; margin: 28px 0; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 14px 28px; border-radius: 8px;
         font-size: 1rem; font-weight: bold; text-decoration: none;
         border: none; cursor: pointer; color: #fff; }
  .btn-approve { background: #1b5e20; }
  .btn-reject  { background: #b71c1c; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px;
            font-size: 0.95rem; display: none; }
  .success { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
  .error   { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
  .info    { color: #555; font-size: 0.9rem; line-height: 1.7; }
  .loading { color: #888; font-style: italic; }
</style>
</head>
<body>
<div class="card">
  <h1>📋 予約承認 — グリーンレンタカー北海道店</h1>
  <div id="info" class="info">読み込み中...</div>
  <div class="btn-wrap">
    <button id="btn-approve" class="btn btn-approve" onclick="doAction('approve')">✓ 承認する</button>
    <button id="btn-reject"  class="btn btn-reject"  onclick="doAction('reject')">✗ 非承認にする</button>
  </div>
  <div id="result"></div>
</div>

<script>
const GAS_URL = 'https://green-rentacar-hokkaido-proxy.shy-snow-b32c.workers.dev';
const params  = new URLSearchParams(location.search);
const receipt = params.get('receiptNo') || '';

document.getElementById('info').innerHTML =
  receipt ? '受付番号：<strong>' + receipt + '</strong>' : '受付番号が指定されていません。';

async function doAction(action) {
  const btnApprove = document.getElementById('btn-approve');
  const btnReject  = document.getElementById('btn-reject');
  const result     = document.getElementById('result');

  btnApprove.disabled = true;
  btnReject.disabled  = true;
  result.style.display = 'block';
  result.className = 'loading';
  result.textContent  = '処理中...';

  try {
    const body = new URLSearchParams();
    body.append('action',    action);
    body.append('receiptNo', receipt);

    const res  = await fetch(GAS_URL, { method: 'POST', body });
    const data = await res.json();

    if (data.success) {
      result.className   = 'success';
      result.textContent = action === 'approve'
        ? '✓ 承認しました。お客様へ確定メールを送信しました。'
        : '✓ 非承認にしました。お客様へご連絡メールを送信しました。';
    } else {
      throw new Error(data.error || data.message || '処理に失敗しました');
    }
  } catch (err) {
    result.className   = 'error';
    result.textContent = 'エラー: ' + err.message;
    btnApprove.disabled = false;
    btnReject.disabled  = false;
  }
}
</script>
</body>
</html>
